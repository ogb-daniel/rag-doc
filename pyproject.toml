[project]
name = "project1"
version = "0.1.0"
description = "Multi-LLM RAG Backend"
authors = [
    {name = "Daniel Ogbuike",email = "ogbuikedaniel@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
   "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.1.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.1",
    "langchain>=0.1.0",
    "openai>=1.10.0"
]

[tool.poetry]
# This section is now only for Poetry-specific behavior
package-mode = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.1.0"
ruff = "^0.1.0"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
